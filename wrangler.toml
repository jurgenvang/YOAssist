name = "yoassist"
main = "src/index.js"
compatibility_date = "2026-08-01"

# De statische app. Bestaat er een bestand voor het gevraagde pad, dan bedient
# Cloudflare dat rechtstreeks; al de rest gaat naar de Worker. Onder /api/
# staan geen bestanden, dus die verzoeken bereiken altijd de code.
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "yoassist"
database_id = "696c9518-702e-4e9f-9832-38c6bb10c6f6"

# Alle kandidaat-uren in UTC. De Worker beslist zelf of het in Brussel
# werkelijk 0, 6, 12 of 18 uur is, zodat zomer- en wintertijd allebei kloppen.
[triggers]
crons = ["0 22,23,4,5,10,11,16,17 * * *"]

# Alleen nodig zolang ctx.access niet beschikbaar is. Een Worker met static
# assets draait achter een interne router, en die geeft ctx.access niet door —
# dan valt de code terug op het zelf verifiëren van het Access-token.
[vars]
CF_ACCESS_TEAM_DOMAIN = "jouwteam.cloudflareaccess.com"
CF_ACCESS_AUD = "VUL-IN-VANUIT-ACCESS-APPLICATIE"
